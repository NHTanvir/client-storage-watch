<!doctype html>
<html><head><meta charset="utf-8"><title>Client Storage Watch</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; margin: 0; }
  header { padding: 8px 10px; border-bottom: 1px solid #8884; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 auto 0 0; width: 100%; }
  input, select, button { font: inherit; padding: 3px 6px; }
  section { padding: 8px 10px; border-bottom: 1px solid #8882; }
  h3 { margin: 6px 0; font-size: 12px; text-transform: uppercase; color: #888; }
  .flag { background: #d33; color: #fff; border-radius: 3px; padding: 0 5px; font-size: 10px; margin-left: 4px; }
  .added { color: #2a9d3a; } .removed { color: #c0640a; } .changed { color: #0a66c0; }
  .k { font-family: monospace; }
  .leftover { color: #d33; font-weight: 600; }
  code { color: #888; word-break: break-all; }
</style></head>
<body>
<header><h1>Client Storage Watch</h1>
  <input id="label" placeholder="label (before login / after logout)" style="flex:1">
  <button id="snap">Snapshot</button>
  <select id="a"></select><span>→</span><select id="b"></select>
  <button id="diff">Diff</button>
  <button id="copy">Copy MD</button>
  <button id="clear">Clear</button>
</header>
<div id="out"></div>
<script type="module" src="panel.js"></script>
</body></html>
